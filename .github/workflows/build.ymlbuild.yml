name: Build QuickOpenNpp

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        architecture: [x64, Win32]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.architecture }}
      - name: Build
        run: cmake --build build --config Release
      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: QuickOpenNpp-${{ matrix.architecture }}
          path: build/Release/QuickOpenNpp.dll
          if-no-files-found: error
